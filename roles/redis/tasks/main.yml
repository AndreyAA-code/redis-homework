---
- name: Redis installing
  block:
    - name: Check if Redis installed
      command: which redis-server
      ignore_errors: true
      register: redis_installed
      changed_when: false

    - name: Install Redis package
      apt:
        name: redis-server
        state: present
        update_cache: yes
        cache_valid_time: 3600
      when: redis_installed.rc != 0 and ansible_os_family == "Debian"

    - name: Ensure Redis data directory exists
      file:
        path: "{{ redis_dir }}"
        state: directory
        owner: redis
        group: redis
        mode: '0750'
      when: ansible_os_family == "Debian"

    - name: Deploy Redis configuration
      template:
        src: redis.conf.j2
        dest: /etc/redis/redis.conf
        owner: redis
        group: redis
        mode: '0640'
      notify:
        - Restart Redis
      when: ansible_os_family == "Debian"
  
    - name: Ensure Redis service is started and enabled
      service:
        name: redis-server
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"


  rescue:
    - name: Install error
      debug:
        msg: "Redis installing error"
